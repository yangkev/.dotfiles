# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'
command_timeout = 2000

[directory]
truncation_length = 8

[git_status]
ahead = "⇡${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
behind = "⇣${count}"
untracked = ""
stashed = ""

[python]
disabled = true

[nodejs]
disabled = true

[pijul_channel]
disabled = true

[battery]
disabled = true

[package]
disabled = true

[docker_context]
disabled = true

[pulumi]
disabled = true

[aws]
disabled = true

[nix_shell]
disabled = true
