# tinty-codex.conf — codex-alert + continuum/clock statusline, re-layered on top
# of the tinted-tmux statusbar. Sourced from ~/.tmux.conf for the fresh-server
# state and re-sourced after every `tinty apply` via tinty's global hook (see
# ~/.config/tinted-theming/tinty/config.toml). All colours use ANSI colour0-15
# so they follow the active tinted-shell palette.

# Clear the codex alert when its window is selected or its pane focused.
set-hook -g after-select-window 'set -w @codex_alert ""'
set-hook -g pane-focus-in 'set -w @codex_alert ""'

# Hot colours for the codex notification flash.
set -g @codex_alert_bg "colour1"
set -g @codex_alert_fg "colour0"

# Right side: continuum save status + date + time.
set -g status-right 'Cont: #{continuum_status} #[fg=colour0,bg=colour8,bold] %m/%d/%y #[fg=colour0,bg=colour7,bold] %l:%M %p'
set -g status-right-length 50

# Active window tab (or the alert flash when @codex_alert is set).
setw -g window-status-current-format '#{?@codex_alert,#[bg=#{@codex_alert_bg}]#[fg=#{@codex_alert_fg}],#[fg=colour6]#[bg=colour8]} #I#[fg=colour7]:#[fg=colour15]#W#[fg=colour6]#F #[default]'

# Inactive window tab (or the alert flash when @codex_alert is set).
setw -g window-status-format '#{?@codex_alert,#[bg=#{@codex_alert_bg}]#[fg=#{@codex_alert_fg}],#[fg=colour4]#[bg=colour0]} #I#[fg=colour8]:#[fg=colour7]#W#[fg=colour8]#F #[default]'
