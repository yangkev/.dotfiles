# --------------------- SETTINGS ----------------------
# set -g default-shell "/usr/bin/zsh"
set -g default-terminal "xterm-256color"
# set -ga terminal-overrides ",*256col*:Tc"

# Persist ssh login across tmux
# https://stackoverflow.com/questions/21378569/how-to-auto-update-ssh-agent-environment-variables-when-attaching-to-existing-tm
set -g update-environment -r
setenv -g SSH_AUTH_SOCK $HOME/.ssh/ssh_auth_sock

# Undercurl support https://ryantravitz.com/blog/2023-02-18-pull-of-the-undercurl/
set-option -gas terminal-overrides "*:Tc" # true color support
set-option -gas terminal-overrides "*:RGB" # true color support
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0

# fix delay problem with vim switching between insert/normal
set -s escape-time 0

# don't rename windows automatically
set -wg automatic-rename off
set -wg allow-rename off

# set window and pane index to 1 (0 by default)
set -g base-index 1
set -wg pane-base-index 1

# renumber windows after closing windows
set -g renumber-windows on

# remember more history
set -g history-limit 100000

# make xterm-keys work as expected
set -wg xterm-keys on

# mouse mode
set -g mouse on

# wheel: route to app in alt-screen (Claude, vim, less), to copy-mode in normal shell
bind -T root WheelUpPane   if-shell -Ft= '#{alternate_on}' 'send-keys -M' 'copy-mode -e; send-keys -M'
bind -T root WheelDownPane if-shell -Ft= '#{alternate_on}' 'send-keys -M' 'send-keys -M'

# don't exit copy mode after yanking, treat mouse-mode as highlight, and yank with "y"
set -g @yank_action 'copy-pipe'
set -g @yank_with_mouse off
# unbind -t vi-copy MouseDragEnd1Pane # for tmux < 2.5
unbind -T copy-mode-vi MouseDragEnd1Pane

# Make double and triple click work outside of copy mode (already works inside it with default bindings).
bind-key -T root DoubleClick1Pane if-shell -Ft'{mouse}' '#{alternate_on}' "send-keys -M" "copy-mode -t{mouse}; send-keys -X select-word"
bind-key -T root TripleClick1Pane if-shell -Ft'{mouse}' '#{alternate_on}' "send-keys -M" "copy-mode -t{mouse}; send-keys -X select-line"

set -g focus-events

# ---------------------- BINDINGS --------------------
# Switch prefix key to C-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind -n C-b send-prefix

# reload config file
bind r source-file ~/.tmux.conf\; display "~/.tmux.conf sourced!"

# split panes using | and -
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
unbind '"'
unbind %

# open new window with same path
bind c new-window -c '#{pane_current_path}'

# switch to las[t] window
bind t last-window

# Move windows around
bind-key -n C-S-Left swap-window -t -1\; select-window -t -1
bind-key -n C-S-Right swap-window -t +1\; select-window -t +1

# switch panes using vim movement keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# resize panes
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# Don't display original window name when renaming
bind , command-prompt -p "(rename-window '#W')" "rename-window '%%'"

# more vim-like copy mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle

# Toggle synchronize panes
bind-key a set-window-option synchronize-panes\; display-message "synchronize-panes is now #{?pane_synchronized,on,off}"

#--------------------- APPEARANCE --------------------

# Make base16-shell colors work on tmux 3.3a
# https://github.com/tmux/tmux/issues/3218#issuecomment-1153404631
set -g allow-passthrough on

# Theming is driven by tinty (tinted-theming). tinted-tmux owns the pane,
# window, mode, message, clock and bell styles plus the statusbar base; it is
# sourced on every `tinty apply` (see ~/.config/tinted-theming/tinty/config.toml).
# Enable tinted-tmux's statusbar.
set-environment -g TINTED_TMUX_OPTION_STATUSBAR 1

# Behaviour (not styling — left to us).
set -g status-position bottom
set -g status-interval 2

# loud or quiet?
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-window-option -g monitor-activity off
set-option -g bell-action none

# Codex-alert + continuum/clock statusline, re-layered on top of tinted-tmux.
# Sourced here for the fresh-server state; tinty's global hook re-sources it
# after every `tinty apply` so it always wins over the tinted-tmux statusbar.
source-file ~/.config/tmux/tinty-codex.conf

# --------------------- PLUGINS -----------------------
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'

set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @resurrect-strategy-vim 'session'
# set -g @resurrect-strategy-nvim 'session'

set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-save-interval '5'
set -g @continuum-restore 'on'
set -g @continuum-boot-options 'alacritty'
set -g @continuum-boot 'on'

set -g @plugin 'wfxr/tmux-fzf-url'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
